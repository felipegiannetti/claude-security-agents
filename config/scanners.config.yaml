# Deterministic scanner configuration (invoked from scripts/scanners/).
version: "0.1.0"

semgrep:
  enabled: true
  config: auto

gitleaks:
  enabled: true

trivy:
  enabled: true

osv_scanner:
  enabled: true

# Cross-references CVEs found by osv_scanner against the CISA Known Exploited
# Vulnerabilities catalog. See scripts/scanners/check_kev.py and
# skills/dependency-cve-check/references/kev-correlation.md.
cisa_kev:
  enabled: true
  feed_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  cache_path: "outputs/.cache/cisa_kev.json"
  cache_ttl_hours: 24
  offline: false  # if true, never hit the network; use cache_path only

# Flags CVEs above a severity threshold disclosed within a recency window,
# independent of CISA KEV listing (that catalog only covers *confirmed*
# active exploitation, a narrow subset of what's worth proactive attention).
# See scripts/scanners/check_cve_policy.py and
# skills/dependency-cve-check/references/cve-policy.md.
cve_policy:
  enabled: true
  min_severity: medium  # low|medium|high|critical
  max_age_days: 365     # only flag CVEs first published within this window

# TODO: per-scanner rule sets, severity thresholds, timeouts.
