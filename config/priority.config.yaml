# Remediation priority configuration. See knowledge/standards/priority-matrix.yaml
# for the underlying criteria and CLAUDE.md "Severity and Priority".
version: "0.1.0"

levels:
  - id: P0
    label: Immediate
  - id: P1
    label: High
  - id: P2
    label: Medium
  - id: P3
    label: Low
  - id: P4
    label: Informational

# Weighting used by scripts/reporting/calculate_priorities.py. Priority is a
# function of severity plus these modifiers -- it is not just severity
# relabeled. Weights are additive score adjustments on top of a severity base
# score (critical=100, high=75, medium=50, low=25, informational=0), then
# bucketed into P0-P4 by the thresholds below.
weights:
  exploitability:
    proof_of_concept_available: +15
    trivial_to_exploit: +10
    requires_chained_conditions: -10
  exposure:
    internet_facing_unauthenticated: +20
    internet_facing_authenticated: +10
    internal_only: -10
  privileges_required:
    none: +10
    user: 0
    privileged_or_admin: -15
  affected_data_sensitivity:
    payment_or_credentials: +15
    pii_or_health: +10
    none: 0
  blast_radius:
    single_tenant_or_user: 0
    multi_tenant: +15
    platform_wide: +25
  confidence:
    HIGH: 0
    MEDIUM: -10
    LOW: -25          # LOW confidence findings should rarely reach P0/P1 regardless of severity
  remediation_effort:
    trivial: +10       # cheap fixes get a small urgency boost -- no excuse to delay
    small: +5
    medium: 0
    large: -5

score_thresholds:
  P0: 90
  P1: 65
  P2: 40
  P3: 15
  P4: 0

# CISA KEV is an exploitability signal, not a severity signal: a KEV-listed
# CVE is confirmed to be actively exploited in the wild, regardless of its
# CVSS score. It overrides the CVSS-derived priority with a floor, it never
# lowers a priority that was already higher for other reasons.
# See scripts/scanners/check_kev.py and
# skills/dependency-cve-check/references/kev-correlation.md.
kev_overrides:
  enabled: true
  listed_priority_floor: P1
  known_ransomware_campaign_use_priority_floor: P0
