# Severity classification. Severity is technical/business impact -- distinct
# from priority (remediation urgency, see priority.config.yaml).
# See knowledge/standards/severity-matrix.yaml for the narrative criteria this
# encodes, and CLAUDE.md "Severity and Priority".
version: "0.1.0"

levels: [critical, high, medium, low, informational]

# Base severity by category. This is a starting point for 08_security_triage,
# not a final answer -- security-verifier may adjust it in
# 09_independent_verification once the
# actual attack scenario is confirmed (see agents/security-verifier.md
# "Severity Review").
category_base_severity:
  sql-injection: critical
  command-injection: critical
  code-injection: critical
  remote-code-execution: critical
  authentication-bypass: critical
  insecure-jwt-verification: critical
  hardcoded-credential-live: critical
  ssrf: high
  broken-object-level-authorization: high
  broken-function-level-authorization: high
  insecure-deserialization: high
  path-traversal: high
  xxe: high
  nosql-injection: high
  ldap-injection: high
  stored-xss: high
  reflected-xss: medium
  dom-xss: medium
  csrf: medium
  open-redirect: low
  clickjacking: low
  missing-security-headers: low
  weak-cryptography: medium
  insecure-random: medium
  mass-assignment: medium
  excessive-data-exposure: medium
  rate-limiting-missing: medium
  hardcoded-credential-placeholder: informational
  iac-misconfiguration: medium
  vulnerable-dependency: medium # further adjusted by CVSS + KEV in scan correlation
  unrestricted-file-upload: critical # assume RCE-capable until verified otherwise -- see skills/file-security-review/references/file-upload.md
  race-condition: high # escalate to critical if verified financial/irreversible impact -- see skills/business-logic-review/references/race-conditions.md
  insufficient-security-logging: medium        # see skills/logging-audit-review/references/insufficient-logging.md
  sensitive-data-exposure-in-logs: high        # credentials/tokens in plaintext logs -- see skills/logging-audit-review/references/sensitive-data-in-logs.md
  missing-audit-trail: medium                  # escalate to high for unaudited impersonation/"login as" -- see skills/logging-audit-review/references/audit-trail-integrity.md
  insufficient-error-correlation: low           # see skills/logging-audit-review/references/error-correlation.md
  dormant-account-abuse: medium                # escalate to high for broad privileges -- see skills/auth-authz-review/references/dormant-account-lifecycle.md
  oauth-account-linking-flaw: critical          # automatic linking on unverified email is a direct account-takeover path -- see skills/auth-authz-review/references/oauth-account-linking.md
  missing-brute-force-protection: high          # see skills/auth-authz-review/references/brute-force-protection.md
  weak-tls-configuration: medium                # see skills/web-security-review/references/tls-configuration.md
  certificate-validation-disabled: high         # escalate toward critical for credentials/PII/financial data on the connection -- see skills/web-security-review/references/tls-configuration.md

# Impact modifiers applied on top of the category base. A modifier can only
# raise severity, never silently lower it below the category base -- lowering
# requires an explicit verifier judgment recorded in the finding's
# verification field, not a config rule.
impact_floors:
  technical_impact_includes_rce: critical
  technical_impact_includes_full_auth_bypass: critical
  affects_data_category:
    payment-data: high
    credentials: high
    pii: high
    health-data: high

# CVSS score/severity mapping for dependency findings is handled separately
# by scripts/scanners/check_cve_policy.py (severity-rating computation) and
# scripts/scanners/check_kev.py (exploitation-status priority floor) -- see
# skills/dependency-cve-check/references/cve-policy.md and kev-correlation.md.
